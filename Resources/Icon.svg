<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="body"><rect x="32" y="32" width="448" height="448" rx="104"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ccbf0"/><stop offset="1" stop-color="#d8effb"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d6aa8"/><stop offset="1" stop-color="#0a2a52"/></linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe8f6"/></linearGradient>
    <linearGradient id="mass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfeaff" stop-opacity="0.85"/><stop offset="1" stop-color="#5fb4e6" stop-opacity="0.35"/></linearGradient>
  </defs>
  <g transform="translate(100 100) scale(1.8393) translate(-32 -32)">
    <g filter="url(#shadow)"><rect x="32" y="32" width="448" height="448" rx="104" fill="#0a2a52"/></g>
    <g clip-path="url(#body)">
      <rect x="32" y="32" width="448" height="220" fill="url(#sky)"/>
      <rect x="32" y="250" width="448" height="230" fill="url(#sea)"/>
      <polygon points="160,252 352,252 404,322 334,424 240,446 150,362" fill="url(#mass)"/>
      <polygon points="240,252 352,252 404,322 334,424" fill="#ffffff" opacity="0.12"/>
      <polygon points="204,252 250,168 286,200 306,146 348,252" fill="url(#tip)"/>
      <polygon points="286,200 306,146 348,252 300,252" fill="#b9dcf1"/>
      <rect x="32" y="248" width="448" height="4" fill="#ffffff" opacity="0.55"/>
    </g>
  </g>
</svg>
